<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Subathon · Schlaftimer</title>
    <link rel="stylesheet" href="sleep.css?v=1.3.6-rf-20260923-1" />

  <body>
    <main class="sleep-overlay" id="sleepOverlay" hidden>
      <header><span class="pulse"></span><div><small>SCHLAFMODUS</small><h1 id="sleepTitle">Der Streamer schläft</h1></div></header>
      <section class="sleep-clock-panel">
        <p class="sleep-label" id="sleepLabel">Noch geplante Schlafzeit</p>
        <output id="sleepTimer" role="timer" aria-live="off">00:00:00</output>
      </section>
      <p class="sleep-rule" id="sleepRule"></p>
      <p class="connection-state" id="sleepConnection" role="status"></p>
    </main>
